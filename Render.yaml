services:
  # Web Service Configuration
  - type: web
    name: my-web-app
    env: node
    plan: free
    region: oregon # Choose your preferred region (e.g., oregon, frankfurt, ohio, singapore)
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Linking securely to the database defined below
      - key: DATABASE_URL
        fromDatabase:
          name: app-database
          property: connectionString

databases:
  # PostgreSQL Database Configuration
  - name: app-database
    plan: free
    databaseName: myappdb
    user: myappuser
    region: oregon
    
