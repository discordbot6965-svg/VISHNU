server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Optional: Add plugins like Youtube source, Spotify, etc.
  server:
    password: "youshallnotpass"
    sources:
      youtube: false # Set to true or use youtube-plugin for YouTube support
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    max-history: 30
    max-size: 1MB
  level:
    root: INFO
    lavalink: INFO
