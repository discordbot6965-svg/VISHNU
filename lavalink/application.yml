server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: "youshallnotpass" # Replace with your environment variable if needed
    sources:
      youtube: false # Disable default YouTube indexing to prevent local DB locks
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH

# Direct logs only to stdout/console (disables disk file writes)
logging:
  level:
    root: INFO
    lavalink: INFO
